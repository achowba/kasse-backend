name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  docker:
    name: Build container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Builds the same multi-stage image that ships, so a broken Dockerfile
      # fails here rather than at deploy time.
      - run: docker build -t plan-vs-actual-api:ci .
