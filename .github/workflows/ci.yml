name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Format, lint, cycles, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      # A cycle between modules compiles and passes tests, then fails at runtime
      # as an undefined injected dependency. It has to be caught by a tool.
      - run: npm run lint:circular

      - run: npm run typecheck

      # Coverage rather than a plain run, so the thresholds in package.json are
      # enforced here rather than being advisory.
      - run: npm run test:cov

      # The end to end suite starts a real mongod as a single node replica set.
      # Caching the binary keeps a ~100MB download off every run.
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm run test:e2e
        env:
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

      - run: npm run build

  docker:
    name: Build container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Builds the same multi-stage image that ships, so a broken Dockerfile
      # fails here rather than at deploy time.
      - run: docker build -t plan-vs-actual-api:ci .
